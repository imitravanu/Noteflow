<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No meta CSP here: the authoritative policy lives in
         src-tauri/tauri.conf.json (app.security.csp). Tauri injects it into
         the bundled HTML and auto-hashes the inline pre-paint script below.
         A second meta policy here only contradicted it (and blocked this
         script in `npm run dev`, breaking the no-flash promise). -->
    <title>NoteFlow</title>
    <script>
      // Pre-paint theme so dark users never see a white flash.
      // Mirrors uiStore localStorage cache; corrected after SQLite loads.
      try {
        var t = localStorage.getItem("noteflow-theme");
        var resolved = t === "light" || t === "dark" ? t : (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        // "system" intentionally resolves here; useTheme() sets the live value.
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
