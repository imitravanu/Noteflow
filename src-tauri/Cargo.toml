[package]
name = "noteflow"
version = "1.4.0"
description = "NoteFlow — offline-first desktop notes for Linux"
authors = ["mitravanu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "noteflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = { version = "0.4", features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

